name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run typecheck
      - run: vp run build
      - run: vp run test:dist
      - run: vp run docs:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # the timing rows of PB-9 are budgets for a quiet machine; shared runners are not one
      - run: vp test run
        env:
          PROTOAPI_SKIP_PERF: "1"
