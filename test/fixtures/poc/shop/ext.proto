syntax = "proto3";

package shop.ext;

import "google/protobuf/descriptor.proto";

enum Behavior {
  BEHAVIOR_UNSPECIFIED = 0;
  REQUIRED = 1;
  OUTPUT_ONLY = 2;
  IMMUTABLE = 3;
}

// explicit presence, like the real protovalidate rules, so that `gt = 0` survives ProtoJSON serialisation
message Int64Rules { optional int64 gt = 1; optional int64 lt = 2; }
message StringRules { optional bool email = 1; optional uint64 min_len = 2; optional uint64 max_len = 3; }
message Rules {
  optional bool required = 1;
  Int64Rules int64 = 2;
  StringRules string = 3;
}

extend google.protobuf.FieldOptions {
  repeated Behavior behavior = 50001;
  Rules rules = 50002;
}
