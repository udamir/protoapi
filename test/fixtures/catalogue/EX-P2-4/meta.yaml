title: string, bytes and number literal forms in defaults
expect:
  - pointer: "#/components/messages/shop.legacy.Literals"
    value:
      type: object
      properties:
        joined: { number: 1, type: string, presence: explicit, default: multipart, utf8Validation: false }
        esc:    { number: 2, type: string, presence: explicit, default: 'ABé"q"', utf8Validation: false }
        empty:  { number: 3, type: string, presence: explicit, default: "", utf8Validation: false }
        high:   { number: 4, type: bytes,  presence: explicit, default: "/wA=" }
        neg:    { number: 5, type: sint32, presence: explicit, default: -127 }
        oct:    { number: 6, type: uint32, presence: explicit, default: 15 }
        tenth:  { number: 7, type: float,  presence: explicit, default: 0.1 }
        huge:   { number: 8, type: double, presence: explicit, default: 1e+300 }
        whole:  { number: 9, type: double, presence: explicit, default: 5 }
      jsonFormat: LEGACY_BEST_EFFORT
