# EX-PV-1 (design Appendix A). Fragment assertions for test/catalogue/catalogue.test.ts.
title: protovalidate scalar, string, bytes and bool rules
expect:
  - pointer: "#/components/messages/shop.v1.Signup"
    value:
      type: object
      properties:
        age:   { number: 1, type: int32, exclusiveMinimum: 0, maximum: 150 }
        ref:   { number: 2, type: int64, minimum: "1" }
        score: { number: 3, type: double, minimum: 0, exclusiveMaximum: 1 }
        email: { number: 4, type: string, required: true, format: email }
        name:  { number: 5, type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z ]+$" }
        code:  { number: 6, type: string, minLength: 6, maxLength: 6, pattern: "^SH" }
        uri:   { number: 7, type: string, format: uri-reference }
        kind:  { number: 8, type: string, enum: [cat, dog] }
        token: { number: 9, type: bytes, minLength: 16, maxLength: 16 }
        tos:   { number: 10, type: bool, const: true }
