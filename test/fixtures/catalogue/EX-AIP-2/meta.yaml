# EX-AIP-2 (design Appendix A). Fragment assertions for test/catalogue/catalogue.test.ts.
title: field_behavior and field_info options
expect:
  - pointer: "#/components/messages/shop.v1.Book"
    value:
      type: object
      properties:
        name:        { number: 1, type: string, protoType: string, options: { google.api.field_behavior: [IDENTIFIER] } }
        title:       { number: 2, type: string, protoType: string, required: true }
        create_time: { number: 3, $ref: "#/components/messages/google.protobuf.Timestamp", readOnly: true }
        etag:        { number: 4, type: string, protoType: string, writeOnly: true }
        isbn:        { number: 5, type: string, protoType: string, required: true, immutable: true }
        authors:     { number: 6, type: array, items: { type: string, protoType: string }, options: { google.api.field_behavior: [UNORDERED_LIST] } }
        id:          { number: 7, type: string, protoType: string, format: uuid }
        ip:          { number: 8, type: string, protoType: string, format: ip }
