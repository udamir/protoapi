# EX-PGV-1 (design Appendix A). Fragment assertions for test/catalogue/catalogue.test.ts.
title: protoc-gen-validate rules
expect:
  - pointer: "#/components/messages/shop.v1.Legacy"
    value:
      type: object
      properties:
        name: { number: 1, type: string, minLength: 1, maxLength: 64 }
