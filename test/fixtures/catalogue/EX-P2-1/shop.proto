syntax = "proto2";
package shop.legacy;
enum Level { LOW = 1; HIGH = 2; }
message Limits {
  optional int32  small    = 1  [default = 0x10];
  optional int64  min_id   = 2  [default = -9223372036854775808];
  optional uint64 max_id   = 3  [default = 18446744073709551615];
  optional double ceiling  = 4  [default = inf];
  optional double floor    = 5  [default = -inf];
  optional float  ratio    = 6  [default = nan];
  optional double scale    = 7  [default = 1e-3];
  optional bool   on       = 8  [default = true];
  optional string greeting = 9  [default = "hi\tthere"];
  optional bytes  magic    = 10 [default = "\x01\x02"];
  optional Level  level    = 11 [default = HIGH];
}
