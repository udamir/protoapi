# EX-MIG-2.after (design Appendix A). Fragment assertions for test/catalogue/catalogue.test.ts.
# phase C (decision F-3): the file-level repeated_field_encoding / utf8_validation / json_format are resolved into the
# packed / utf8Validation / jsonFormat keywords and leave files.options; components equal EX-MIG-2.before
title: proto2 to edition 2023, after
expect:
  - pointer: "#/components/messages"
    value:
      shop.legacy.Order:
        type: object
        properties:
          id:           { number: 1, type: integer, protoType: int64, presence: required }
          note:         { number: 2, type: string, protoType: string, presence: explicit, default: none, utf8Validation: false }
          codes:        { number: 3, type: array, items: { type: integer, protoType: int32 }, packed: false }
          packed_codes: { number: 4, type: array, items: { type: integer, protoType: int32 } }
          color:        { number: 5, $ref: "#/components/enums/shop.legacy.Color", presence: explicit, default: GREEN }
          meta:         { number: 6, $ref: "#/components/messages/shop.legacy.Order.Meta", delimited: true }
        jsonFormat: LEGACY_BEST_EFFORT
      shop.legacy.Order.Meta:
        type: object
        properties: { total: { number: 1, type: integer, protoType: int32, presence: explicit } }
        jsonFormat: LEGACY_BEST_EFFORT
  - pointer: "#/components/enums"
    value:
      shop.legacy.Color: { type: string, closed: true, jsonFormat: LEGACY_BEST_EFFORT, values: { RED: { number: 1 }, GREEN: { number: 2 } } }
  - pointer: "#/files"
    value:
      shop.proto: { syntax: "2023", package: shop.legacy, options: { features: { enum_type: CLOSED } } }
  - pointer: "#/files/shop.proto/options/features"
    keyOrder: [enum_type]
