syntax = "proto3";
package shop.v1;
import "google/api/client.proto";
import "google/longrunning/operations.proto";

service ShelfService {
  option deprecated = true;
  option (google.api.default_host) = "shelves.example.com";
  option (google.api.oauth_scopes) = "https://www.googleapis.com/auth/cloud-platform";

  rpc ArchiveShelf(ArchiveShelfRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "Shelf"
      metadata_type: "ArchiveMetadata"
    };
  }
  rpc Noop(NoopRequest) returns (NoopResponse) {}
}
message ArchiveShelfRequest {}
message NoopRequest {}
message NoopResponse {}
