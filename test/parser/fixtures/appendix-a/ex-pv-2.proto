message Filter {
  repeated string labels = 1 [(buf.validate.field).repeated = { min_items: 1, max_items: 10, unique: true, items: { string: { max_len: 32 } } }];
  map<string, int32> quotas = 2 [(buf.validate.field).map = { min_pairs: 1, keys: { string: { min_len: 1 } }, values: { int32: { gte: 0 } } }];
  Status status = 3 [(buf.validate.field).enum = { defined_only: true, in: [1, 2] }];
  Status not_sold = 4 [(buf.validate.field).enum.not_in = 2];
}
