import "validate/validate.proto";
message Legacy {
  string name = 1 [(validate.rules).string = { min_len: 1, max_len: 64 }];
  uint64 id   = 2 [(validate.rules).uint64.gt = 999];
  Pet    pet  = 3 [(validate.rules).message.required = true];
  repeated int32 ids = 4 [(validate.rules).repeated = { min_items: 1, items: { int32: { gt: 0 } } }];
}
